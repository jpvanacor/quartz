<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker - CPP (852 artigos)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fdf6e3;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #b5651d 0%, #8b4513 100%);
            color: #fdf6e3;
            padding: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #b5651d;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #b5651d 0%, #8b4513 100%);
            transition: width 0.3s ease;
        }

        .filters {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #b5651d;
            background: white;
            color: #b5651d;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #b5651d;
            color: white;
        }

        .filter-btn.active {
            background: #b5651d;
            color: white;
        }

        .content {
            padding: 30px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .book {
            margin-bottom: 40px;
        }

        .book-title {
            font-size: 24px;
            color: #3d2e1f;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 4px solid #b5651d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-progress {
            font-size: 14px;
            color: #666;
            font-weight: normal;
        }

        .title-section {
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 3px solid #d4916a;
        }

        .title-header {
            font-size: 18px;
            color: #5a4a3a;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .article-item {
            padding: 8px 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .article-item:hover {
            background: rgba(181, 101, 29, 0.05);
            border-color: #b5651d;
        }

        .article-item.completed {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .article-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #b5651d;
        }

        .article-item.completed input[type="checkbox"] {
            accent-color: #4caf50;
        }

        .hidden {
            display: none;
        }

        .actions {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #b5651d;
            color: white;
        }

        .btn-primary:hover {
            background: #8b4513;
        }

        .btn-secondary {
            background: white;
            color: #666;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
            }
            .articles-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
        }
    </style>
</head>

        <div class="filters">

        let progress = {};

        function initializeProgress() {
            const saved = localStorage.getItem('cppProgress');
            if (saved) {
                progress = JSON.parse(saved);
            } else {
                progress = {};
                allArticles.forEach(art => {
                    progress[`art-${art}`] = false;
                });
            }
        }

        function saveProgress() {
            localStorage.setItem('cppProgress', JSON.stringify(progress));
            localStorage.setItem('cppLastUpdate', new Date().toLocaleString('pt-BR'));
            updateStats();
        }

        function toggleArticle(artNumber) {
            const key = `art-${artNumber}`;
            progress[key] = !progress[key];
            saveProgress();
            renderContent();
        }

        function updateStats() {
            const total = allArticles.length;
            const studied = Object.values(progress).filter(v => v).length;
            const percentage = Math.round((studied / total) * 100);

            document.getElementById('totalProgress').textContent = percentage + '%';
            document.getElementById('studiedCount').textContent = `${studied}/${total}`;
            document.getElementById('progressBar').style.width = percentage + '%';
            
            const lastUpdate = localStorage.getItem('cppLastUpdate') || '--';
            document.getElementById('lastUpdate').textContent = lastUpdate.split(' ')[0];
        }

        function renderContent() {
            const container = document.getElementById('content');
            container.innerHTML = '';

            let booksToShow = [];
            if (currentFilter === 'all' || currentFilter === 'pending') {
                booksToShow = Object.keys(cppStructure);
            } else {
                booksToShow = [currentFilter];
            }

            booksToShow.forEach(bookKey => {
                const book = cppStructure[bookKey];
                const bookDiv = document.createElement('div');
                bookDiv.className = 'book';

                let bookTotal = 0;
                let bookStudied = 0;
                
                book.ranges.forEach(range => {
                    range.articles.forEach(art => {
                        bookTotal++;
                        if (progress[`art-${art}`]) bookStudied++;
                    });
                });

                const bookPercentage = Math.round((bookStudied / bookTotal) * 100);

                const bookTitle = document.createElement('div');
                bookTitle.className = 'book-title';
                bookTitle.innerHTML = `
                    <span>${book.title}</span>
                    <span class="book-progress">${bookPercentage}% (${bookStudied}/${bookTotal})</span>
                `;
                bookDiv.appendChild(bookTitle);

                book.ranges.forEach(range => {
                    const titleSection = document.createElement('div');
                    titleSection.className = 'title-section';

                    const titleHeader = document.createElement('div');
                    titleHeader.className = 'title-header';
                    titleHeader.textContent = range.name;
                    titleSection.appendChild(titleHeader);

                    const articlesGrid = document.createElement('div');
                    articlesGrid.className = 'articles-grid';

                    let hasVisibleArticles = false;

                    range.articles.forEach(art => {
                        const key = `art-${art}`;
                        const isCompleted = progress[key];

                        if (currentFilter === 'pending' && isCompleted) return;

                        hasVisibleArticles = true;

                        const articleItem = document.createElement('div');
                        articleItem.className = 'article-item' + (isCompleted ? ' completed' : '');

                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.checked = isCompleted;
                        checkbox.onchange = () => toggleArticle(art);

                        const label = document.createElement('span');
                        label.textContent = `Art. ${art}`;

                        articleItem.appendChild(checkbox);
                        articleItem.appendChild(label);
                        articleItem.onclick = (e) => {
                            if (e.target !== checkbox) {
                                checkbox.checked = !checkbox.checked;
                                toggleArticle(art);
                            }
                        };

                        articlesGrid.appendChild(articleItem);
                    });

                    if (hasVisibleArticles) {
                        titleSection.appendChild(articlesGrid);
                        bookDiv.appendChild(titleSection);
                    }
                });

                if (bookDiv.querySelectorAll('.title-section').length > 0) {
                    container.appendChild(bookDiv);
                }
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            renderContent();
        }

        function resetProgress() {
            if (confirm('Tem certeza que deseja resetar todo o progresso?')) {
                progress = {};
                allArticles.forEach(art => {
                    progress[`art-${art}`] = false;
                });
                saveProgress();
                renderContent();
            }
        }

        function exportProgress() {
            const total = allArticles.length;
            const studied = Object.values(progress).filter(v => v).length;
            const data = {
                progress: progress,
                lastUpdate: localStorage.getItem('cppLastUpdate'),
                total: total,
                studied: studied,
                percentage: Math.round((studied / total) * 100),
                totalArticles: allArticles.length
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cpp-progress-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setFilter(btn.dataset.filter);
            });
        });

        initializeProgress();
        renderContent();
        updateStats();
    </script>
</body>
</html>
